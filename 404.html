<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var hour = new Date().toLocaleString('en-US', {
                timeZone: 'Europe/Madrid',
                hour: 'numeric',
                hour12: false
            });
            hour = parseInt(hour, 10);

            var THEMES = [
                { from: 1, to: 8, bg: '#3C2C23', text: '#EAE5DD' },
                { from: 8, to: 14, bg: '#EAE5DD', text: '#612705' },
                { from: 14, to: 19, bg: '#EAE5DD', text: '#3C2C23' },
                { from: 19, to: 24, bg: '#3C2C23', text: '#F6ECBD' },
                { from: 0, to: 1, bg: '#3C2C23', text: '#F6ECBD' }
            ];

            var theme = THEMES.find(function (t) {
                return hour >= t.from && hour < t.to;
            }) || THEMES[2];

            document.documentElement.style.setProperty('--bg', theme.bg);
            document.documentElement.style.setProperty('--text', theme.text);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found — Adriana Yue</title>
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://www.adrianayue.com">

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png">

    <link rel="stylesheet" href="/styles.css">
</head>


<body class="no-scroll">
    <main class="page-404">
        <h1>Page Not Found</h1>
        <a href="/">
            <h2>homepage</h2>
        </a>
    </main>

    <script src="/script.js"></script>
</body>

</html>
